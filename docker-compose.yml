version: '3.8'

services:
  redis:
    image: redis/redis-stack:latest  # ✅ uses your local image
    container_name: redis
    ports:
      - "6379:6379"
      - "8001:8001" 
  ollama:
    image: ollama/ollama:latest       # ✅ uses your local image
    container_name: ollama
    ports:
      - "11434:11434"
  springboot:
    #build:
    #  context: .                      # 👈 assumes Dockerfile in root
    image: springai-springboot:latest
    container_name: springai-app
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - ollama
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      OLLAMA_BASE_URL: http://ollama:11434
